<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UA Intelligence V3 — Ad Creative Trend Report</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* 배경 계층 (깊이 순) */
      --bg: #0d0f15;
      --surface: #161923;
      --surface2: #1e2230;
      --surface3: #262b3d;            /* hover 상태 */
      --border: #272c3f;
      --border-strong: #3a4160;       /* hover·active 보더 */
      /* 텍스트 계층 — WCAG AA(4.5:1) 이상 */
      --text: #eef0f8;
      --text-2: #b8bfd4;              /* 보조 텍스트 */
      --muted: #8891a5;
      --fg: var(--text);
      /* 브랜드·시맨틱 */
      --accent: #6c63ff;
      --accent-hover: #7f77ff;
      --accent2: #00d4aa;
      --success: #4ade80;
      --info: #60a5fa;
      --warn: #fbbf24;
      --danger: #f87171;
      /* 형태·모션 */
      --radius: 10px;
      --radius-sm: 7px;
      --shadow-1: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-2: 0 4px 16px rgba(0,0,0,0.35);
      --t: 180ms cubic-bezier(0.2, 0, 0, 1);
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
                   'Segoe UI', 'Noto Sans KR', system-ui, sans-serif;
      font-size: 14px; min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* 키보드 포커스 가시화 (마우스 클릭에는 링 없음) */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    button { font-family: inherit; }

    /* 스크롤바 — 다크 테마에 맞춘 절제형 */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 5px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
    ::-webkit-scrollbar-track { background: transparent; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 13px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 16px; font-weight: 800; letter-spacing: -0.01em; }
    .logo span { color: var(--accent); }
    .header-meta { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: calc(100vh - 53px);
      overflow: hidden;
    }
    /* 누적 상위 소재 탭: 사이드바 없이 전체 폭 사용 */
    .layout.no-sidebar { grid-template-columns: 1fr; }

    /* ── Sidebar ── */
    .sidebar { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }

    .filters {
      padding: 14px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .filter-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; }

    .filter-row { display: flex; gap: 6px; }

    select {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 7px;
      font-size: 12px;
      outline: none;
      transition: border-color var(--t);
    }
    select:focus { border-color: var(--accent); }

    .week-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 7px;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      transition: border-color var(--t);
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }
    .week-btn:hover, .week-btn:focus { border-color: var(--accent); outline: none; }
    .week-btn .cal-icon { font-size: 11px; opacity: 0.5; }

    /* ── 커스텀 주 선택 캘린더 ── */
    .week-btn-wrap {
      position: relative;
      flex: 1;
    }
    #weekPickerHidden { display: none; }

    .wc-dropdown {
      /* 사이드바 overflow:hidden에 잘리지 않도록 뷰포트 기준 배치 (좌표는 JS가 계산) */
      position: fixed;
      z-index: 999;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      width: 224px;
      display: none;
    }
    .wc-dropdown.open { display: block; }

    .wc-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .wc-nav button {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .wc-nav button:hover { background: var(--surface2); }
    .wc-nav span { font-size: 12px; font-weight: 600; }

    .wc-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
    }
    .wc-dh {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      padding: 2px 0 4px;
    }
    /* 한 주 = 7칸짜리 행을 감싸는 래퍼 */
    .wc-week-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .wc-week-row:hover { background: var(--surface2); }
    .wc-week-row.selected { background: var(--accent); }
    .wc-week-row.selected .wc-day { color: #fff; }

    .wc-day {
      text-align: center;
      font-size: 11px;
      padding: 5px 0;
      color: var(--text);
      border-radius: 4px;
    }
    .wc-day.empty { color: transparent; }
    .wc-day.today { font-weight: 700; color: var(--accent2); }
    .wc-week-row.selected .wc-day.today { color: #fff; }

    .btn {
      padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer;
      font-size: 13px; font-weight: 600; transition: opacity 0.2s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; margin-top: 2px; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Advertiser List ── */
    .advertiser-list { flex: 1; overflow-y: auto; }
    .advertiser-list::-webkit-scrollbar { width: 4px; }
    .advertiser-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .list-header {
      padding: 8px 14px;
      font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky; top: 0;
    }

    .advertiser-item {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px;
      cursor: pointer; transition: background 0.12s;
      border-bottom: 1px solid rgba(46,51,80,0.5);
    }
    .advertiser-item:hover { background: var(--surface2); }
    .advertiser-item.active { background: var(--surface2); border-left: 2px solid var(--accent); padding-left: 10px; }

    .rank-badge {
      min-width: 24px; height: 24px; border-radius: 6px;
      background: var(--surface); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; color: var(--muted);
    }
    .rank-badge.top3 { background: rgba(108,99,255,0.15); border-color: var(--accent); color: var(--accent); }

    .app-icon {
      width: 34px; height: 34px; border-radius: 8px;
      object-fit: cover; background: var(--surface2); border: 1px solid var(--border); flex-shrink: 0;
    }
    .app-icon-ph {
      width: 34px; height: 34px; border-radius: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px;
    }

    .app-info { flex: 1; min-width: 0; }
    .app-name { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }

    .creative-count { text-align: right; flex-shrink: 0; }
    .cc-val { font-size: 13px; font-weight: 700; color: var(--accent2); }
    .cc-label { font-size: 9px; color: var(--muted); text-transform: uppercase; }

    /* ── Main ── */
    .main { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    .main::-webkit-scrollbar { width: 4px; }
    .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── States ── */
    .state-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 48px 24px; color: var(--muted); text-align: center;
    }
    .state-box .icon { font-size: 40px; opacity: 0.4; }

    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── App Detail Header ── */
    .app-header {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 20px;
      display: flex; align-items: center; gap: 14px;
    }
    .app-header-icon {
      width: 56px; height: 56px; border-radius: 12px;
      object-fit: cover; background: var(--surface2); border: 1px solid var(--border);
    }
    .app-header-name { font-size: 18px; font-weight: 700; }
    .app-header-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }

    .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .chip {
      padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600;
      background: var(--surface2); border: 1px solid var(--border);
    }
    .chip.green { color: var(--accent2); border-color: rgba(0,212,170,0.3); }
    .chip.purple { color: var(--accent); border-color: rgba(108,99,255,0.3); }

    /* ── Section ── */
    .section-title {
      font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
    }

    /* ── 누적 상위 소재: 필터 바 + 통계 라인 ── */
    .cum-bar {
      padding: 12px 16px 10px; border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
    }
    .facet-row { display: flex; align-items: baseline; gap: 10px; }
    .facet-row.facet-inline { flex-wrap: wrap; gap: 8px 22px; }
    .facet-group { display: flex; align-items: baseline; gap: 10px; }
    .facet-label {
      font-size: 11px; color: var(--muted); font-weight: 600;
      min-width: 48px; flex-shrink: 0;
    }
    .facet-inline .facet-label { min-width: 0; }
    .facet-chips { display: flex; gap: 5px; flex-wrap: wrap; }
    .chip-btn {
      background: var(--surface2); color: var(--muted);
      border: 1px solid var(--border); border-radius: 999px;
      padding: 3px 10px; font-size: 11px; cursor: pointer;
      transition: all var(--t); white-space: nowrap;
    }
    .chip-btn b { font-weight: 700; opacity: 0.55; margin-left: 2px; }
    .chip-btn:hover { color: var(--fg); border-color: var(--accent); }
    .chip-btn.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .chip-btn.active b { opacity: 0.75; }
    .chip-btn.empty { opacity: 0.42; }

    .tier-toggle {
      display: flex; gap: 8px; justify-content: center;
      margin: 2px 0 10px;
    }
    .tier-btn {
      background: var(--surface2); color: var(--muted);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 26px; font-size: 14px; font-weight: 700; cursor: pointer;
      letter-spacing: 0.2px; transition: all var(--t);
    }
    .tier-btn:hover { color: var(--fg); border-color: var(--accent); }
    .tier-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .tc-stats {
      padding: 0 10px 9px; font-size: 10.5px; color: var(--muted);
      display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
    }
    .tc-stats .cont-yes { color: var(--success); font-weight: 700; }
    .tc-stats .cont-no  { color: #8b93a7; }

    /* ── 크리에이티브 노트 ── */
    .note-scroll { overflow-y: auto; }
    .note-list { max-width: 860px; margin: 20px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
    .note-item {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 18px; cursor: pointer; transition: border-color var(--t), transform var(--t);
    }
    .note-item:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .note-item-title { font-size: 15px; font-weight: 700; line-height: 1.4; }
    .note-item-meta { font-size: 12px; color: var(--muted); margin-top: 5px; }

    .note-page { max-width: 860px; margin: 0 auto; padding: 24px 20px 60px; }
    .note-back {
      background: none; border: 1px solid var(--border); color: var(--text-2);
      border-radius: var(--radius-sm); padding: 5px 12px; font-size: 12px; cursor: pointer;
      margin-bottom: 18px; transition: all var(--t);
    }
    .note-back:hover { color: var(--text); border-color: var(--border-strong); }
    .note-title { font-size: 21px; font-weight: 800; line-height: 1.35; letter-spacing: -0.01em; }
    .note-date { font-size: 12px; color: var(--muted); margin: 8px 0 16px; }
    .note-intro {
      font-size: 13.5px; color: var(--text-2); line-height: 1.65;
      border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; margin-bottom: 28px;
    }

    .note-creative {
      display: grid; grid-template-columns: 240px 1fr; gap: 22px;
      padding: 26px 0; border-top: 1px solid var(--border);
    }
    .note-media {
      position: relative; align-self: start; cursor: pointer;
      border-radius: var(--radius); overflow: hidden; background: var(--surface2);
      aspect-ratio: 9/14;
    }
    .note-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .note-media:hover { outline: 2px solid var(--accent); }
    .note-app-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .note-app-name { font-size: 14px; font-weight: 700; }
    .note-app-meta { font-size: 11.5px; color: var(--muted); }
    .note-verdict {
      margin-left: auto; font-size: 12px; font-weight: 800; color: var(--warn);
      background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.35);
      border-radius: 6px; padding: 3px 10px; white-space: nowrap;
    }
    .note-headline { font-size: 17px; font-weight: 800; margin: 4px 0 12px; letter-spacing: -0.01em; }
    .note-p { font-size: 13.5px; line-height: 1.75; color: var(--text-2); margin-bottom: 10px; }
    .note-take {
      border-radius: var(--radius-sm); padding: 10px 14px; margin-top: 10px; font-size: 12.5px;
    }
    .note-take b { display: block; font-size: 11px; letter-spacing: 0.05em; margin-bottom: 6px; }
    .note-take ul { margin: 0; padding-left: 16px; }
    .note-take li { line-height: 1.6; margin-bottom: 3px; }
    .note-take.good { background: rgba(74,222,128,0.07); border: 1px solid rgba(74,222,128,0.25); }
    .note-take.good b { color: var(--success); }
    .note-take.bad { background: rgba(248,113,113,0.07); border: 1px solid rgba(248,113,113,0.25); }
    .note-take.bad b { color: var(--danger); }

    .note-synthesis {
      margin-top: 10px; padding: 24px; border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--border-strong);
    }
    .note-synthesis h2 { font-size: 16px; font-weight: 800; margin-bottom: 16px; }
    .syn-point { margin-bottom: 16px; }
    .syn-title { font-size: 13.5px; font-weight: 700; color: var(--warn); margin-bottom: 6px; }

    @media (max-width: 760px) {
      .note-creative { grid-template-columns: 1fr; }
      .note-media { max-width: 300px; }
    }

    /* ── 주간 브리핑: 리포트 카드 ── */
    .report {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      margin: 4px 0 24px;
    }
    .report-block {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 16px 16px;
      box-shadow: var(--shadow-1);
    }
    .report-block.wide { grid-column: 1 / -1; }
    .report-title {
      font-size: 12px; font-weight: 700; margin-bottom: 12px;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-2);
      display: flex; align-items: center; gap: 6px;
    }
    .report-title::before {
      content: ''; width: 3px; height: 12px; border-radius: 2px;
      background: var(--accent); display: inline-block;
    }
    .report-block.wide .report-title::before { background: var(--warn); }

    .must-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 9px; }
    .must-card {
      display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px 8px 8px; transition: border-color var(--t);
    }
    .must-card:hover { border-color: var(--accent); }
    .must-no {
      flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: 11px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .must-thumb {
      position: relative; flex-shrink: 0; width: 42px; height: 56px;
      border-radius: 5px; overflow: hidden; background: var(--bg);
    }
    .must-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tc-play.sm {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 18px; height: 18px; font-size: 8px;
    }
    .must-body { min-width: 0; }
    .must-app { font-size: 12.5px; font-weight: 700; }
    .must-reason { font-size: 11px; color: var(--info); margin-top: 2px; line-height: 1.35; }
    .must-meta { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
    .must-sov {
      font-size: 11px; color: var(--text-2); margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }
    .must-sov b { color: var(--text); }
    .must-sov .sov-tag {
      font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px;
      background: var(--surface3); color: var(--muted); margin-left: 3px;
    }
    .must-sov.surge .sov-tag { background: rgba(74,222,128,0.14); color: var(--success); }
    .must-sov.drop  .sov-tag { background: rgba(248,113,113,0.12); color: var(--danger); }

    .must-hook { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
    .hook-chip {
      font-size: 10px; font-weight: 700; color: #d4b0ff;
      background: rgba(160,100,255,0.13); border: 1px solid rgba(160,100,255,0.35);
      border-radius: 4px; padding: 1px 6px;
    }
    .conf-tag { font-size: 9px; font-weight: 700; color: var(--muted); }
    .conf-tag.conf-high { color: var(--success); }
    .conf-tag.conf-low  { color: var(--danger); }
    .must-why {
      font-size: 11px; color: var(--fg); opacity: 0.82; line-height: 1.45; margin-top: 4px;
    }

    .mover-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .mover-head { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .mover { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; font-size: 12px; }
    .mover-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mover-num { flex-shrink: 0; color: var(--muted); font-size: 11px; }
    .mover-num.up b { color: var(--success); }
    .mover-num.down b { color: var(--danger); }

    .anomaly { font-size: 12px; line-height: 1.6; }
    .anomaly.none { color: var(--muted); }
    .anomaly b.up { color: var(--warn); }
    .anomaly b.down { color: var(--danger); }
    .anomaly-note {
      font-size: 10px; color: var(--muted); border: 1px solid var(--border);
      border-radius: 4px; padding: 1px 5px; margin-left: 4px;
    }

    /* ── 주간 브리핑 ── */
    .brief-bar { padding-bottom: 12px; }
    .brief-week-row { display: flex; align-items: center; gap: 10px; }
    .brief-week-sel {
      background: var(--surface2); color: var(--fg);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .brief-scroll { overflow-y: auto; padding: 4px 16px 20px; }
    .brief-section { margin-bottom: 26px; }
    .brief-head {
      display: flex; align-items: baseline; gap: 8px;
      padding: 8px 0 10px; border-bottom: 1px solid var(--border); margin-bottom: 12px;
    }
    .brief-title { font-size: 15px; font-weight: 800; }
    .brief-count {
      font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
      background: var(--surface2); color: var(--muted);
    }
    .brief-desc { font-size: 11.5px; color: var(--muted); }
    .sec-new  .brief-title { color: var(--success); }
    .sec-rise .brief-title { color: var(--info); }
    .sec-long .brief-title { color: var(--warn); }
    .sec-drop .brief-title { color: var(--danger); }
    .brief-empty { color: var(--muted); font-size: 12px; padding: 6px 0 2px; }
    .brief-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;
    }
    .brief-card .tc-thumb-wrap { aspect-ratio: 9/16; }
    .brief-metric {
      padding: 0 10px 9px; font-size: 11px; color: var(--muted);
      display: flex; align-items: center; gap: 5px;
    }
    .brief-delta { color: var(--info); font-weight: 800; }
    .brief-sub { color: var(--muted); }

    /* ── 수명 뱃지 (상위권 등장 주수 등급) ── */
    .life-badge {
      display: none; font-size: 10px; font-weight: 700;
      padding: 2px 6px; border-radius: 4px; margin-left: 4px;
      vertical-align: middle; white-space: nowrap;
    }
    .life-badge.half    { display: inline-block; background: rgba(255,193,7,0.15);  color: var(--warn); border: 1px solid rgba(255,193,7,0.4); }
    .life-badge.quarter { display: inline-block; background: rgba(190,205,225,0.14); color: #becde1; border: 1px solid rgba(190,205,225,0.38); }
    .life-badge.month   { display: inline-block; background: rgba(205,127,50,0.15);  color: #cf9868; border: 1px solid rgba(205,127,50,0.42); }
    .life-badge.fresh   { display: inline-block; background: rgba(80,220,120,0.14);  color: var(--success); border: 1px solid rgba(80,220,120,0.38); }

    /* ── Creatives Grid ── */
    .creatives-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }

    .creative-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; cursor: pointer;
      transition: border-color var(--t), transform var(--t);
      position: relative;
    }
    .creative-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .thumb-wrap { position: relative; width: 100%; aspect-ratio: 9/16; background: var(--surface2); }
    .creative-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--border); }

    .play-icon {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center;
      font-size: 14px; pointer-events: none;
    }
    .duration-badge {
      position: absolute; bottom: 6px; right: 6px;
      background: rgba(0,0,0,0.75); color: #fff;
      font-size: 10px; font-weight: 600; padding: 2px 5px; border-radius: 4px;
    }

    /* 카드 다운로드 버튼 */
    .card-dl-btn {
      position: absolute; top: 7px; right: 7px; z-index: 2;
      width: 28px; height: 28px; border-radius: 7px;
      background: rgba(0,0,0,0.65); border: 1px solid rgba(255,255,255,0.15);
      color: #fff; font-size: 13px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.15s;
      cursor: pointer;
    }
    .creative-card:hover .card-dl-btn { opacity: 1; }
    .card-dl-btn:hover { background: var(--accent); border-color: var(--accent); }

    /* 전체 다운로드 버튼 */
    .btn-dl-all {
      padding: 7px 14px; border-radius: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: border-color var(--t), color 0.2s;
      display: flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .btn-dl-all:hover { border-color: var(--accent2); color: var(--accent2); }
    .btn-dl-all:disabled { opacity: 0.5; cursor: not-allowed; }

    .creative-info { padding: 8px 10px; }
    .creative-type-badge {
      display: inline-block; padding: 2px 6px; border-radius: 4px;
      font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
      margin-bottom: 4px;
    }
    .t-video { background: rgba(108,99,255,0.2); color: var(--accent); }
    .t-image { background: rgba(0,212,170,0.15); color: var(--accent2); }
    .t-playable { background: rgba(255,200,0,0.15); color: #ffc800; }
    .t-other { background: rgba(255,107,107,0.15); color: var(--danger); }

    .creative-formats { font-size: 10px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .creative-dates { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* ── Creative Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-nav-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 960px;
      width: 100%;
    }
    .modal-nav-btn {
      flex-shrink: 0;
      width: 42px; height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, opacity 0.15s;
      line-height: 1;
    }
    .modal-nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.2); }
    .modal-nav-btn:disabled { opacity: 0.2; cursor: default; }
    .modal-nav-counter {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      background: rgba(0,0,0,0.4);
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
      pointer-events: none;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      gap: 0;
      overflow: hidden;
      max-height: 90vh;
      max-width: 900px;
      width: 100%;
      animation: scaleIn 0.15s ease;
    }
    @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .modal-media {
      flex-shrink: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 360px;
      min-height: 400px;
      position: relative;
    }
    .modal-video {
      max-width: 360px;
      max-height: 80vh;
      display: block;
      outline: none;
    }
    .modal-image {
      max-width: 360px;
      max-height: 80vh;
      object-fit: contain;
      display: block;
    }
    .modal-no-media {
      color: var(--muted); font-size: 13px; padding: 24px; text-align: center;
    }

    .modal-info {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }
    .modal-info::-webkit-scrollbar { width: 4px; }
    .modal-info::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .modal-close {
      position: absolute; top: 14px; right: 14px;
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(255,255,255,0.1); border: none;
      color: #fff; font-size: 16px; cursor: pointer; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.2); }

    .modal-app-row {
      display: flex; align-items: center; gap: 12px;
    }
    .modal-app-icon {
      width: 48px; height: 48px; border-radius: 10px;
      object-fit: cover; border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .modal-app-name { font-size: 16px; font-weight: 700; }
    .modal-app-pub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .modal-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .modal-meta-item {}
    .modal-meta-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
    .modal-meta-value { font-size: 13px; font-weight: 600; margin-top: 2px; }

    .modal-dl-btn {
      display: flex; align-items: center; justify-content: center; gap-6px;
      padding: 10px; border-radius: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); font-size: 13px; font-weight: 600;
      text-decoration: none; cursor: pointer;
      transition: border-color var(--t);
      gap: 6px;
    }
    .modal-dl-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Tab Nav ── */
    .tab-nav { display: flex; gap: 4px; }
    .tab-btn {
      padding: 7px 16px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 600;
      background: none; border: none; color: var(--text-2);
      cursor: pointer; transition: color var(--t), background var(--t);
    }
    .tab-btn:hover { color: var(--text); background: var(--surface2); }
    .tab-btn.active { color: #fff; background: var(--accent); }

    /* ── Top Creatives ── */
    .tc-main { display: flex; flex-direction: column; overflow: hidden; }
    .tc-result-header {
      padding: 10px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; gap: 12px;
    }
    .tc-result-info { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .tc-per-page-row { display: flex; align-items: center; gap: 6px; }
    .tc-per-page-label { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .tc-per-page-sel {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 4px 8px; border-radius: 6px;
      font-size: 12px; outline: none; cursor: pointer;
    }
    .tc-per-page-sel:focus { border-color: var(--accent); }

    .tc-scroll { flex: 1; overflow-y: auto; }
    .tc-scroll::-webkit-scrollbar { width: 4px; }
    .tc-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .tc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
      padding: 18px;
    }
    .tc-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden; cursor: pointer; position: relative;
      transition: border-color var(--t), transform var(--t), box-shadow var(--t);
    }
    .tc-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
      box-shadow: var(--shadow-2);
    }

    .tc-rank {
      position: absolute; top: 10px; left: 10px; z-index: 2;
      background: rgba(0,0,0,0.75); color: #fff;
      font-size: 11px; font-weight: 700;
      padding: 3px 8px; border-radius: 10px;
    }
    .tc-rank.top3 { background: var(--accent); }

    .tc-thumb-wrap {
      position: relative; background: #000;
      aspect-ratio: 9/16; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .tc-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .tc-thumb-ph { color: var(--muted); font-size: 32px; }
    .tc-play {
      position: absolute; font-size: 28px; opacity: 0.85; pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }
    .tc-dur {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.7); color: #fff;
      font-size: 10px; padding: 2px 6px; border-radius: 5px;
    }
    .tc-dl-btn {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      width: 30px; height: 30px; border-radius: 7px;
      background: rgba(0,0,0,0.65); border: none; color: #fff;
      font-size: 13px; cursor: pointer; display: none;
      align-items: center; justify-content: center;
    }
    .tc-card:hover .tc-dl-btn { display: flex; }
    .tc-dl-btn:hover { background: var(--accent); }

    .tc-app-row {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 10px 4px;
    }
    .tc-app-icon { width: 32px; height: 32px; border-radius: 7px; object-fit: cover; flex-shrink: 0; }
    .tc-app-icon-ph { width: 32px; height: 32px; border-radius: 7px; background: var(--surface2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .tc-app-text { min-width: 0; }
    .tc-app-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tc-app-pub  { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

    .tc-footer { padding: 4px 10px 10px; display: flex; gap: 5px; flex-wrap: wrap; }
    .tc-badge { font-size: 10px; padding: 2px 6px; border-radius: 5px; background: var(--surface2); color: var(--muted); white-space: nowrap; }

    /* ── Pagination ── */
    .tc-pagination {
      padding: 14px 20px; border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; gap: 6px;
      flex-shrink: 0;
    }
    .pg-btn {
      min-width: 32px; height: 32px; padding: 0 8px;
      border-radius: 7px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text);
      font-size: 12px; cursor: pointer; transition: all var(--t);
      display: flex; align-items: center; justify-content: center;
    }
    .pg-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .pg-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    .pg-btn:disabled { opacity: 0.3; cursor: default; }
    .pg-ellipsis { color: var(--muted); font-size: 12px; padding: 0 4px; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: #2d1f1f; border: 1px solid var(--danger); color: #ffaaaa;
      padding: 10px 14px; border-radius: var(--radius); font-size: 12px; z-index: 999;
      display: none; max-width: 340px; word-break: break-word;
    }
    .toast.show { display: block; animation: slideIn 0.2s ease; }
    @keyframes slideIn { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

<header>
  <div class="logo">UA <span>Intelligence</span> V3</div>
  <div class="tab-nav">
    <button class="tab-btn active" id="tab-gameUA" onclick="switchTab('gameUA')">게임 UA</button>
    <button class="tab-btn" id="tab-topCreatives" onclick="switchTab('topCreatives')">상위 소재</button>
    <button class="tab-btn" id="tab-cumulative" onclick="switchTab('cumulative')">누적 상위 소재</button>
    <button class="tab-btn" id="tab-brief" onclick="switchTab('brief')">주간 브리핑</button>
    <button class="tab-btn" id="tab-notes" onclick="switchTab('notes')">크리에이티브 노트</button>
  </div>
  <div class="header-meta" id="headerMeta"></div>
</header>

<div class="layout">
  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="filters">
      <div class="filter-label">필터</div>

      <div class="filter-row">
        <select id="platform" title="플랫폼" onchange="loadMeta()">
          <option value="all">📱 전체 플랫폼</option>
          <option value="ios">iOS</option>
          <option value="android">Android</option>
        </select>
        <select id="country" title="국가">
          <option value="all">🌍 전체 국가</option>
          <option value="US">🇺🇸 US</option>
          <option value="KR">🇰🇷 KR</option>
          <option value="JP">🇯🇵 JP</option>
          <option value="GB">🇬🇧 GB</option>
          <option value="DE">🇩🇪 DE</option>
          <option value="FR">🇫🇷 FR</option>
          <option value="BR">🇧🇷 BR</option>
        </select>
      </div>

      <div class="filter-row">
        <select id="network" title="네트워크">
          <option value="all">📡 전체 네트워크</option>
        </select>
        <select id="adTypes" title="소재 유형">
          <option value="all">🎨 전체 유형</option>
          <option value="video">Video</option>
          <option value="image">Image</option>
          <option value="playable">Playable</option>
          <option value="banner">Banner</option>
        </select>
      </div>

      <div class="filter-row">
        <select id="category" title="카테고리">
          <option value="6014">Games (All)</option>
        </select>
        <div class="week-btn-wrap">
          <button type="button" class="week-btn" id="weekBtn" style="width:100%" onclick="toggleWeekCalendar()">
            <span id="weekBtnLabel">—</span>
            <span class="cal-icon">📅</span>
          </button>
          <input type="hidden" id="weekPickerHidden" />
          <div class="wc-dropdown" id="wcDropdown">
            <div class="wc-nav">
              <button onclick="wcNav(-1)">‹</button>
              <span id="wcMonthLabel"></span>
              <button onclick="wcNav(1)">›</button>
            </div>
            <div class="wc-grid" id="wcGrid"></div>
          </div>
        </div>
      </div>

      <button class="btn btn-primary" id="fetchBtn" onclick="fetchData()">조회</button>
    </div>

    <div id="advertiserList" class="advertiser-list">
      <div class="state-box">
        <div class="icon">📊</div>
        <p>필터를 선택하고<br>조회 버튼을 누르세요</p>
      </div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main" id="mainContent">
    <div class="state-box">
      <div class="icon">🎮</div>
      <p>좌측에서 광고주를 선택하면<br>UA 소재를 확인할 수 있습니다</p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- ── Creative Modal ── -->
<div class="modal-backdrop" id="modalBackdrop" style="display:none" onclick="closeModal(event)">
  <div class="modal-nav-wrapper" id="modalNavWrapper">
    <button class="modal-nav-btn" id="modalNavPrev" onclick="navModal(-1)" title="이전 소재 (←)">‹</button>
    <div class="modal" id="modal">
      <div class="modal-media" id="modalMedia">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <span class="modal-nav-counter" id="modalNavCounter"></span>
      </div>
      <div class="modal-info" id="modalInfo"></div>
    </div>
    <button class="modal-nav-btn" id="modalNavNext" onclick="navModal(1)" title="다음 소재 (→)">›</button>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────
  let allAdUnits = [];          // raw API response
  let advertisers = [];         // grouped by app
  let selectedAppId = null;
  let modalKeys = [];           // 현재 앱의 소재 key 순서
  let modalIdx  = -1;           // 현재 열린 소재 인덱스
  let activeTab    = 'gameUA';  // 현재 탭

  // ── Tab Switch ─────────────────────────────────────────────
  function switchTab(tab) {
    if (activeTab === tab) return;
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');

    const advertiserList   = document.getElementById('advertiserList');

    const sidebar = document.querySelector('.sidebar');
    const layout  = document.querySelector('.layout');

    if (tab === 'cumulative' || tab === 'brief' || tab === 'notes') {
      // 로컬 DB만 조회 → 사이드바 없이 즉시 조회 (센서타워 호출 없음)
      sidebar.style.display = 'none';
      layout.classList.add('no-sidebar');
      advertiserList.style.display = 'none';
      document.getElementById('mainContent').className = 'main tc-main';
      tab === 'brief' ? fetchBrief() : tab === 'notes' ? fetchNotes() : fetchCumulative();
      return;
    }
    sidebar.style.display = '';
    layout.classList.remove('no-sidebar');

    if (tab === 'topCreatives') {
      advertiserList.style.display = 'none';
      document.getElementById('mainContent').className = 'main tc-main';
      document.getElementById('mainContent').innerHTML =
        '<div class="state-box"><div class="icon">🎨</div><p>필터를 선택하고<br>조회 버튼을 누르세요</p></div>';
    } else {
      advertiserList.style.display = '';

  function initWeekSelect() {
    const today = new Date();
    const day = today.getDay();
    const lastMonday = new Date(today);
    lastMonday.setDate(today.getDate() - (day === 0 ? 6 : day - 1));
    lastMonday.setHours(0, 0, 0, 0);
    wcYear  = lastMonday.getFullYear();
    wcMonth = lastMonday.getMonth();

    updateWeekBtn(wcSelected);

  function toggleWeekCalendar() {
    const dd = document.getElementById('wcDropdown');
    dd.classList.toggle('open');
    if (dd.classList.contains('open')) {
      // 버튼 위치 기준으로 뷰포트 좌표 계산 (아래 공간 부족 시 위로 펼침)
      const r = document.querySelector('.week-btn').getBoundingClientRect();
      const H = 300;  // 달력 대략 높이
      const top = (r.bottom + 6 + H > window.innerHeight && r.top - 6 - H > 0)
        ? r.top - 6 - H
        : r.bottom + 6;
      dd.style.top  = `${Math.max(8, top)}px`;
      dd.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - 240))}px`;
      renderWcGrid();
    }

  function closeWeekCalendar() {

  function wcNav(dir) {
    wcMonth += dir;
    if (wcMonth < 0)  { wcMonth = 11; wcYear--; }
    if (wcMonth > 11) { wcMonth = 0;  wcYear++; }
    renderWcGrid();
  }

  function renderWcGrid() {
    const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    document.getElementById('wcMonthLabel').textContent = `${wcYear}년 ${months[wcMonth]}`;

    const grid = document.getElementById('wcGrid');
    const today = localDateStr(new Date());

    // 요일 헤더
    let html = ['월','화','수','목','금','토','일'].map(d =>
      `<div class="wc-dh">${d}</div>`).join('');

    // 이 달 1일의 요일 (0=일..6=토) → 월요일 시작이므로 offset 계산
    const firstDay = new Date(wcYear, wcMonth, 1).getDay();
    const offset = firstDay === 0 ? 6 : firstDay - 1; // 1일 앞에 빈 칸 수
    const daysInMonth = new Date(wcYear, wcMonth + 1, 0).getDate();

    // 첫 행 시작 월요일 날짜 계산
    const startDate = new Date(wcYear, wcMonth, 1 - offset);

    // 6주치 행 생성
    for (let week = 0; week < 6; week++) {
      const monday = new Date(startDate);
      monday.setDate(startDate.getDate() + week * 7);
      const mondayStr = localDateStr(monday);

      const isSelected = mondayStr === wcSelected;
      html += `<div class="wc-week-row${isSelected ? ' selected' : ''}" onclick="selectWeek('${mondayStr}')">`;

      for (let d = 0; d < 7; d++) {
        const cur = new Date(monday);
        cur.setDate(monday.getDate() + d);
        const curStr = localDateStr(cur);
        const inMonth = cur.getMonth() === wcMonth;
        const isToday = curStr === today;
        const cls = ['wc-day', !inMonth ? 'empty' : '', isToday ? 'today' : ''].filter(Boolean).join(' ');
        html += `<div class="${cls}">${inMonth ? cur.getDate() : ''}</div>`;
      }
      html += `</div>`;

      // 마지막 행이 완전히 다음 달이면 생략
      const lastDayOfRow = new Date(monday);
      lastDayOfRow.setDate(monday.getDate() + 6);
      if (week >= 4 && lastDayOfRow.getMonth() !== wcMonth) break;
    }

    grid.innerHTML = html;
  }

  function selectWeek(mondayStr) {
    wcSelected = mondayStr;
    // 캘린더 표시 달을 선택된 주의 달로 이동

    wcYear = y; wcMonth = m - 1;

  // Date → "YYYY-MM-DD"
  function localDateStr(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function weekToMonday(val) {

  // ── 누적 상위 소재 (스냅샷 DB 기반) ──────────────────────────
  const TIER_LABEL = { half: '반기 TOP', quarter: '분기 TOP', month: '월간 TOP' };
  const DIM_LABEL  = { network: '네트워크', country: '국가', platform: '플랫폼', ad_type: '유형' };
  const VAL_LABEL  = { ios: 'iOS', android: 'Android', video: 'Video', image: 'Image' };

  // 조합 간 평균이 섞이지 않도록 '전체' 없이 단일 조합 선택을 강제한다
  // (unified 네트워크는 플랫폼 구분이 없으므로 platform='all' 고정 + 칩 숨김)
  const UNIFIED_NETS = ['Meta Audience Network', 'TikTok'];
  let cumTier = 'half';
  let cumSel  = { network: 'Meta Audience Network', country: 'KR', platform: 'all', ad_type: 'video' };

  function setCumTier(t) {
    if (t === cumTier) return;
    cumTier = t;
    fetchCumulative();
  }

  function setCumFilter(dim, val) {
    if (cumSel[dim] === val) return;
    cumSel[dim] = val;
    if (dim === 'network') {
      // unified ↔ public 전환 시 플랫폼 상태 정리
      if (UNIFIED_NETS.includes(val)) cumSel.platform = 'all';
      else if (cumSel.platform === 'all') cumSel.platform = 'ios';

    fetchCumulative();
  }

  // 등급 토글 + 차원별 칩 필터 (수집된 값만 노출, 단일 선택)
  function cumBarHtml(facets = {}) {
    const tiers = Object.entries(TIER_LABEL).map(([k, v]) =>
      `<button class="tier-btn ${k === cumTier ? 'active' : ''}" onclick="setCumTier('${k}')">${v}</button>`
    ).join('');

    // 칩 도메인은 수집 범위로 고정, 개수만 현재 필터 기준으로 동적 표시.
    // (파셋 값에만 의존하면 데이터 없는 조합에서 칩이 사라져 전환 자체가 막힌다)
    const DIM_DOMAIN = {
      network: ['Meta Audience Network', 'Youtube', 'TikTok', 'Applovin', 'Unity', 'Admob', 'Vungle'],
      country: ['US', 'KR'],
      platform: ['ios', 'android'],
      ad_type: ['video', 'image'],
    };
    const group = dim => {
      const counts = Object.fromEntries((facets[dim]?.values || []).map(v => [v.value, v.count]));
      const chips = DIM_DOMAIN[dim].map(v => {
        const n = counts[v] || 0;
        return `<button class="chip-btn ${cumSel[dim] === v ? 'active' : ''} ${n ? '' : 'empty'}"
          onclick="setCumFilter('${dim}','${v.replace(/'/g, "\\'")}')">
          ${VAL_LABEL[v] || v} <b>${n}</b></button>`;
      }).join('');
      return `<div class="facet-group"><span class="facet-label">${DIM_LABEL[dim]}</span>
        <div class="facet-chips">${chips}</div></div>`;
    };

    // unified 네트워크 선택 시 플랫폼 칩 숨김 (구분 자체가 없음)
    const showPlatform = !UNIFIED_NETS.includes(cumSel.network);
    const netRow    = group('network');
    const inlineRow = ['country', ...(showPlatform ? ['platform'] : []), 'ad_type']
      .map(group).join('');

    return `<div class="cum-bar">
      <div class="tier-toggle">${tiers}</div>
      ${netRow ? `<div class="facet-row">${netRow}</div>` : ''}
      ${inlineRow ? `<div class="facet-row facet-inline">${inlineRow}</div>` : ''}
    </div>`;
  }

              ${it.sov ? (() => {
                const s = it.sov;
                const pct = v => v == null ? '—' : (v * 100).toFixed(2) + '%';
                const surge = s.ratio == null ? (s.sov >= 0.005 ? 'surge' : '') : (s.ratio >= 1.5 ? 'surge' : s.ratio < 0.7 ? 'drop' : '');
                const tag = s.ratio == null ? (s.sov >= 0.005 ? 'NEW 대량' : 'NEW') : `×${s.ratio}`;
                return `<div class="must-sov ${surge}">앱 노출점유 ${s.network}·${s.country} — ${pct(s.prev_sov)} → <b>${pct(s.sov)}</b> <span class="sov-tag">${tag}</span></div>`;
              })() : ''}
              ${it.explanation ? `<div class="must-why">${it.explanation}</div>` : ''}
            </div>
          </div>`;
      }).join('');

      const moverRow = (m, up) => `
        <div class="mover">
          <span class="mover-name" title="${m.name}">${m.name}</span>
          <span class="mover-num ${up ? 'up' : 'down'}">${m.prev} → ${m.cur}
            <b>${m.delta > 0 ? '+' : ''}${m.delta}</b></span>
        </div>`;

      const anomalyHtml = (rep.anomalies || []).length
        ? rep.anomalies.map(a =>
            `<div class="anomaly">${a.label} <b>${a.now.toLocaleString()}</b>
             — 직전 4주 평균 ${a.base.toLocaleString()} 대비
             <b class="${a.dev > 0 ? 'up' : 'down'}">${a.dev > 0 ? '+' : ''}${a.dev}%</b>
             <span class="anomaly-note">원인 확인 필요</span></div>`).join('')
        : `<div class="anomaly none">직전 4주 평균 대비 특이사항 없음</div>`;

      const reportHtml = `
        <div class="report">
          <div class="report-block wide">
            <div class="report-title">이번주 체크 소재</div>
            ${mustCards ? `<div class="must-list">${mustCards}</div>`
                        : `<div class="brief-empty">기준을 충족한 소재 없음</div>`}
          </div>
          <div class="report-block">
            <div class="report-title">이번 주 움직인 광고주</div>
            <div class="mover-cols">
              <div><div class="mover-head">소재 급증</div>
                ${(rep.movers_up || []).map(m => moverRow(m, true)).join('') || '<div class="brief-empty">—</div>'}</div>
              <div><div class="mover-head">소재 급감</div>
                ${(rep.movers_down || []).map(m => moverRow(m, false)).join('') || '<div class="brief-empty">—</div>'}</div>
            </div>
          </div>
          <div class="report-block">
            <div class="report-title">이상 신호</div>
            ${anomalyHtml}
          </div>
        </div>`;

      const body = reportHtml + BRIEF_SECTIONS.map(sec => {
        const items = data.sections[sec.key] || [];
        const cards = items.map(it => {
          const key = `brief_${sec.key}_${it.unit.id}`;
          creativeStore[key] = { creative: it.creative, unit: it.unit, appInfo: it.app_info };
          return briefCardHtml(it, key);
        }).join('');
        return `
          <section class="brief-section">
            <div class="brief-head ${sec.cls}">
              <span class="brief-title">${sec.title}</span>
              <span class="brief-count">${items.length}</span>
              <span class="brief-desc">${sec.desc}</span>
            </div>
            ${items.length
              ? `<div class="brief-grid">${cards}</div>`
              : `<div class="brief-empty">해당 소재 없음</div>`}
          </section>`;
      }).join('');

      main.innerHTML = `
        <div class="cum-bar brief-bar">
          <div class="brief-week-row"><span class="facet-label">기준 주</span>${weekSel}</div>
        </div>
        <div class="tc-scroll brief-scroll">${body}</div>`;
      annotateLifetime();
    } catch (e) {
      showToast(e.message);
      main.innerHTML = `<div class="state-box"><div class="icon">⚠️</div><p>${e.message}</p></div>`;
    } finally {

    }
  }

  // ── 크리에이티브 노트 ────────────────────────────────────────

  // ── Top Creatives State ────────────────────────────────────
  let tcAllItems  = [];   // 전체 소재 목록 (fetch 결과)
  let tcAllKeys   = [];   // 전체 key 순서 (모달 nav 용)
  let tcPage      = 1;
  let tcPerPage   = 20;
  let tcInfoText  = '';   // 결과 헤더 문구 (누적 탭에서 커스텀)

  // ── Top Creatives Render (전체 저장 후 1페이지 렌더) ──────
  function renderTopCreatives(list, infoText = '') {
    tcInfoText = infoText;
    const main = document.getElementById('mainContent');

    list.forEach(item => {
      const key = item.creative.id || Math.random().toString(36).slice(2);
      creativeStore[key] = { creative: item.creative, unit: item.unit, appInfo: item.app_info };
      item._key = key;
      tcAllKeys.push(key);
    });
    tcAllItems = list;
    tcPage = 1;

    // 레이아웃 뼈대 (헤더 + 스크롤 영역 + 페이지네이션)
    main.innerHTML = `
      <div class="tc-result-header">

          <select class="tc-per-page-sel" id="tcPerPageSel" onchange="setTcPerPage(+this.value)">
            <option value="10">10개</option>
            <option value="20" selected>20개</option>
            <option value="50">50개</option>

        <div class="tc-grid" id="tcGrid"></div>
      </div>
      <div class="tc-pagination" id="tcPagination"></div>`;

    renderTcPage();
  }

  function renderTcPage() {
    const total  = tcAllItems.length;
    const pages  = Math.ceil(total / tcPerPage);
    const start  = (tcPage - 1) * tcPerPage;
    const slice  = tcAllItems.slice(start, start + tcPerPage);
    const sliceKeys = tcAllKeys.slice(start, start + tcPerPage);

    // 결과 정보
    document.getElementById('tcResultInfo').textContent =
      `${tcInfoText || `총 ${total}개 소재`} · ${start + 1}–${Math.min(start + tcPerPage, total)} 표시`;

    // 카드 그리드
    const cards = slice.map(item => {
      const { creative, unit, app_info: appInfo, rank, _key: key, stats } = item;
      const thumb   = creative.thumb_url || '';
      const type    = unit.ad_type || '';
      const isVideo = type.includes('video');
      const dur     = creative.video_duration ? fmtDuration(creative.video_duration) : '';
      const net     = unit.network || '';
      const ctry    = unit.country || '';
      const pub     = appInfo?.publisher_name || '';

      const iconHtml = appInfo?.icon_url
        ? `<img class="tc-app-icon" src="${appInfo.icon_url}" alt="" onerror="this.style.display='none'">`
        : `<div class="tc-app-icon-ph">🎮</div>`;

      return `
        <div class="tc-card">
          <div class="tc-rank ${rank <= 3 ? 'top3' : ''}">#${rank}</div>
          <button class="tc-dl-btn" title="다운로드">⬇</button>
          <div class="tc-thumb-wrap">
            ${thumb ? `<img src="${thumb}" alt="" loading="lazy">` : '<div class="tc-thumb-ph">🖼️</div>'}
            ${isVideo ? '<div class="tc-play">▶</div>' : ''}
            ${dur ? `<div class="tc-dur">${dur}</div>` : ''}
          </div>
          <div class="tc-app-row">
            ${iconHtml}
            <div class="tc-app-text">
              <div class="tc-app-name" title="${appInfo?.name || ''}">${appInfo?.name || '—'}</div>
              ${pub ? `<div class="tc-app-pub">${pub}</div>` : ''}
            </div>
          </div>
          <div class="tc-footer">
            ${type ? `<span class="tc-badge creative-type-badge ${typeClass(type)}">${type}</span>` : ''}
            ${net  ? `<span class="tc-badge">${net}</span>` : ''}
            ${ctry ? `<span class="tc-badge">${ctry}</span>` : ''}
            <span class="life-badge" data-life-uid="${unit.id || ''}"></span>
          </div>
          ${stats ? `<div class="tc-stats" title="${stats.first_week} ~ ${stats.last_week}">
            ${stats.weeks}주 등장 · 최고 상위 ${stats.best_pct}% · 평균 상위 ${stats.avg_pct}%
            <span class="${stats.consecutive ? 'cont-yes' : 'cont-no'}">${stats.consecutive ? '연속' : '간헐'}</span>
          </div>` : ''}
        </div>`;
    }).join('');

    document.getElementById('tcGrid').innerHTML = cards;

    // 이벤트 바인딩
    document.getElementById('tcGrid').querySelectorAll('.tc-card').forEach((el, i) => {
      const globalIdx = start + i;
      el.onclick = () => {
        modalKeys = tcAllKeys;
        modalIdx  = globalIdx;
        openCreativeModal(sliceKeys[i]);
      };
      el.querySelector('.tc-dl-btn').onclick = e => {
        e.stopPropagation();
        downloadCreative(sliceKeys[i]);
      };
    });

    // 수명 뱃지 채우기
    annotateLifetime();

    // 페이지네이션 버튼
    document.getElementById('tcPagination').innerHTML = buildPagination(tcPage, pages);

    // 스크롤 맨 위
    const scroll = document.getElementById('tcScroll');
    if (scroll) scroll.scrollTop = 0;
  }

  function buildPagination(current, total) {
    if (total <= 1) return '';
    const btn = (p, label, cls = '') =>
      `<button class="pg-btn ${cls}" onclick="setTcPage(${p})" ${p === current ? 'disabled' : ''}
        ${cls === 'active' ? 'style="pointer-events:none"' : ''}>${label}</button>`;

    let html = btn(current - 1, '‹', current === 1 ? 'disabled' : '');
    const range = new Set([1, total, current - 1, current, current + 1].filter(p => p >= 1 && p <= total));
    let prev = 0;
    [...range].sort((a, b) => a - b).forEach(p => {
      if (prev && p - prev > 1) html += '<span class="pg-ellipsis">…</span>';
      html += btn(p, p, p === current ? 'active' : '');
      prev = p;
    });
    html += btn(current + 1, '›', current === total ? 'disabled' : '');
    return html;
  }

  function setTcPage(p) {
    const pages = Math.ceil(tcAllItems.length / tcPerPage);
    if (p < 1 || p > pages) return;
    tcPage = p;
    renderTcPage();
  }

  function setTcPerPage(n) {
    tcPerPage = n;
    tcPage = 1;
    renderTcPage();
  }

  // ── 수명 뱃지 (스냅샷 DB 기반 top100 잔류 주수) ──────────────
  const lifetimeCache = {};   // unit_id → history 또는 null(이력 없음)

  async function annotateLifetime() {
    const spans = [...document.querySelectorAll('.life-badge[data-life-uid]')]
      .filter(s => s.dataset.lifeUid && !s.dataset.done);
    if (!spans.length) return;

    const need = [...new Set(spans.map(s => s.dataset.lifeUid))]
      .filter(id => !(id in lifetimeCache));
    if (need.length) {
      try {
        const res = await fetch(`/api/creative-history?unit_ids=${need.join(',')}`);
        const { history = {} } = await res.json();
        need.forEach(id => { lifetimeCache[id] = history[id] || null; });
      } catch { return; }  // 이력 조회 실패는 조용히 무시 (뱃지만 생략)
    }

    spans.forEach(s => {
      s.dataset.done = '1';
      const h = lifetimeCache[s.dataset.lifeUid];
      if (!h) return;  // 수집 범위 밖(네트워크/국가) 소재는 뱃지 없음
      // 등급: 반기(24주+) / 분기(12주+) / 월간(4주+) — 3주 이하는 뱃지 없음
      if (h.weeks >= 24)      { s.textContent = '반기 TOP'; s.classList.add('half'); }
      else if (h.weeks >= 12) { s.textContent = '분기 TOP'; s.classList.add('quarter'); }
      else if (h.weeks >= 4)  { s.textContent = '월간 TOP'; s.classList.add('month'); }
      else if (h.weeks === 1) { s.textContent = '신규';     s.classList.add('fresh'); }
      else return;   // 2~3주는 아직 판단 유보 구간
      s.title = `상위권 등장 ${h.weeks}주 (${h.first_week} ~ ${h.last_week}) · 최고 상위 ${h.best_pct}%`;
    });
  }

  // ── Creative Store (카드 클릭 시 데이터 전달용) ──────────────
  const creativeStore = {};

  // ── Render Creative Card ───────────────────────────────────
  function renderCreativeCard(creative, unit, appInfo) {
    const thumb = creative.thumb_url || '';
    const type  = unit.ad_type || 'unknown';
    const dur   = creative.video_duration ? fmtDuration(creative.video_duration) : '';
    const isVideo = type.includes('video');

    // 클릭 시 조회할 데이터 저장
    const key = creative.id || (Math.random().toString(36).slice(2));
    creativeStore[key] = { creative, unit, appInfo };

    return `
      <div class="creative-card" onclick="openCreativeModal('${key}')">
        <button class="card-dl-btn" title="다운로드" onclick="event.stopPropagation(); downloadCreative('${key}')">⬇</button>
        <div class="thumb-wrap">
          ${thumb
            ? `<img class="creative-thumb" src="${thumb}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<div class=thumb-ph>🖼️</div>'">`
            : `<div class="thumb-ph">🖼️</div>`}
          ${isVideo ? `<div class="play-icon">▶</div>` : ''}
          ${dur ? `<div class="duration-badge">${dur}</div>` : ''}
        </div>
        <div class="creative-info">
          <span class="creative-type-badge ${typeClass(type)}">${type}</span><span class="life-badge" data-life-uid="${unit.id || ''}"></span>
          <div class="creative-formats">${(unit.ad_formats || []).join(', ') || '—'}</div>
          <div class="creative-dates">${unit.first_seen_at || ''} ~ ${unit.last_seen_at || ''}</div>
        </div>
      </div>
    `;
  }

  // ── Modal Nav ──────────────────────────────────────────────
  function navModal(dir) {
    const next = modalIdx + dir;
    if (next < 0 || next >= modalKeys.length) return;
    openCreativeModal(modalKeys[next]);
  }

  function updateNavButtons() {
    const prev = document.getElementById('modalNavPrev');
    const next = document.getElementById('modalNavNext');
    const counter = document.getElementById('modalNavCounter');
    if (prev) prev.disabled = modalIdx <= 0;
    if (next) next.disabled = modalIdx >= modalKeys.length - 1;
    if (counter) counter.textContent = modalKeys.length > 1 ? `${modalIdx + 1} / ${modalKeys.length}` : '';
  }

  // ── Modal Open ─────────────────────────────────────────────
  function openCreativeModal(key) {
    const { creative, unit, appInfo } = creativeStore[key] || {};
    if (!creative) return;

    // modalKeys에 이미 이 key가 있으면 (tc뷰에서 미리 설정된 경우) 유지
    // 없으면 같은 앱 소재 목록으로 새로 구성
    if (!modalKeys.includes(key)) {
      const appId = appInfo?.app_id;
      modalKeys = appId !== undefined
        ? Object.keys(creativeStore).filter(k => String(creativeStore[k].appInfo?.app_id) === String(appId))
        : [key];
    }
    modalIdx = modalKeys.indexOf(key);

    const type    = unit.ad_type || '';
    const isVideo = type.includes('video');
    const mediaUrl = creative.creative_url || '';
    const dur      = creative.video_duration ? fmtDuration(creative.video_duration) : '—';
    const w = creative.width, h = creative.height;
    const ratio = (w && h) ? `${w}×${h}` : '—';

    // 미디어 영역
    const mediaHtml = isVideo
      ? `<video class="modal-video" src="${mediaUrl}" controls autoplay playsinline loop></video>`
      : mediaUrl
        ? `<img class="modal-image" src="${mediaUrl}" alt="creative">`
        : `<div class="modal-no-media">미리보기 없음</div>`;

    document.getElementById('modalMedia').innerHTML =
      `<button class="modal-close" onclick="closeModal()">✕</button>${mediaHtml}`;

    // 정보 영역
    const iconHtml = appInfo?.icon_url
      ? `<img class="modal-app-icon" src="${appInfo.icon_url}" alt="">`
      : `<div class="modal-app-icon" style="background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;">🎮</div>`;

    document.getElementById('modalInfo').innerHTML = `
      <div class="modal-app-row">
        ${iconHtml}
        <div>
          <div class="modal-app-name">${appInfo?.name || '—'}</div>
          <div class="modal-app-pub">${appInfo?.publisher_name || '—'}</div>
        </div>
      </div>

      <div class="modal-meta-grid">
        <div class="modal-meta-item">
          <div class="modal-meta-label">유형</div>
          <div class="modal-meta-value"><span class="creative-type-badge ${typeClass(type)}">${type}</span></div>
        </div>
        <div class="modal-meta-item">
          <div class="modal-meta-label">재생시간</div>
          <div class="modal-meta-value">${dur}</div>
        </div>
        <div class="modal-meta-item">
          <div class="modal-meta-label">해상도</div>
          <div class="modal-meta-value">${ratio}</div>
        </div>
        <div class="modal-meta-item">
          <div class="modal-meta-label">포맷</div>
          <div class="modal-meta-value">${(unit.ad_formats || []).join(', ') || '—'}</div>
        </div>
        <div class="modal-meta-item">
          <div class="modal-meta-label">최초 노출</div>
          <div class="modal-meta-value">${unit.first_seen_at || '—'}</div>
        </div>
        <div class="modal-meta-item">
          <div class="modal-meta-label">최근 노출</div>
          <div class="modal-meta-value">${unit.last_seen_at || '—'}</div>
        </div>
      </div>

      <button class="modal-dl-btn" onclick="downloadByUrl('${encodeURIComponent(mediaUrl)}', '${encodeURIComponent((appInfo?.name||'creative')+'_'+unit.id+adTypeExt(unit.ad_type))}')">
        ⬇ 원본 다운로드
      </button>
    `;

    document.getElementById('modalBackdrop').style.display = 'flex';
    document.body.style.overflow = 'hidden';
    updateNavButtons();
  }

  // ── Modal Close ────────────────────────────────────────────
  function closeModal(e) {
    if (e) {
      const backdrop = document.getElementById('modalBackdrop');
      const wrapper  = document.getElementById('modalNavWrapper');
      if (e.target !== backdrop && e.target !== wrapper) return;
    }
    const backdrop = document.getElementById('modalBackdrop');
    const video = backdrop.querySelector('video');
    if (video) { video.pause(); video.src = ''; }
    backdrop.style.display = 'none';
    document.body.style.overflow = '';
    modalKeys = []; modalIdx = -1;
  }

  document.addEventListener('keydown', e => {
    const isOpen = document.getElementById('modalBackdrop').style.display !== 'none';
    if (e.key === 'Escape') { closeModal(); return; }
    if (!isOpen) return;
    if (e.key === 'ArrowLeft')  { e.preventDefault(); navModal(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); navModal(1);  }
  });

  // ── ad_type → 파일 확장자 ──────────────────────────────────
  function adTypeExt(adType) {
    const t = (adType || '').toLowerCase();
    if (t.includes('video'))                          return '.mp4';
    if (t.includes('playable') || t.includes('interactive')) return '.zip';
    return '.jpg';   // image / banner / full_screen 등
  }

  // ── 공통 다운로드 유틸 (fetch+Blob → 확실한 파일 저장) ────
  async function downloadByUrl(encodedUrl, encodedFilename) {
    const url = decodeURIComponent(encodedUrl);
    // 확장자는 호출부에서 이미 포함된 상태로 전달됨
    const filename = decodeURIComponent(encodedFilename);
    try {
      const resp = await fetch(`/api/download?url=${encodeURIComponent(url)}&filename=${encodeURIComponent(filename)}`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const blob = await resp.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      // blob URL 즉시 revoke 시 브라우저가 파일 저장을 못 할 수 있으므로 지연 해제
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
    } catch (e) {
      console.error('Download failed', e);
      showToast('다운로드 실패: ' + e.message);
    }
  }

  // ── 개별 다운로드 ──────────────────────────────────────────
  async function downloadCreative(key) {
    const { creative, unit, appInfo } = creativeStore[key] || {};
    if (!creative?.creative_url) return;
    const ext = adTypeExt(unit?.ad_type);
    const filename = `${appInfo?.name || 'creative'}_${unit.id}${ext}`;
    await downloadByUrl(encodeURIComponent(creative.creative_url), encodeURIComponent(filename));
  }

  // ── 전체 다운로드 ──────────────────────────────────────────
  async function downloadAll(appId) {
    const app = advertisers.find(a => String(a.app_id) === String(appId));
    if (!app) return;

    // creativeStore에서 해당 앱 소재 전부 수집
    const keys = Object.keys(creativeStore).filter(
      k => String(creativeStore[k].appInfo?.app_id) === String(appId) && creativeStore[k].creative?.creative_url
    );
    if (!keys.length) return;

    const btn = document.getElementById('dlAllBtn');
    btn.disabled = true;

    for (let i = 0; i < keys.length; i++) {
      btn.textContent = `⬇ ${i + 1} / ${keys.length} 다운로드 중…`;
      await downloadCreative(keys[i]);  // fetch + blob 완료 후 다음으로 진행
      // 브라우저가 이전 다운로드를 처리할 시간 확보
      if (i < keys.length - 1) await new Promise(r => setTimeout(r, 800));
    }

    btn.disabled = false;
    btn.textContent = `✓ ${keys.length}개 완료`;
    setTimeout(() => { btn.textContent = '⬇ 전체 다운로드'; }, 3000);
  }
</script>
</body>
</html>
